# Render Blueprint - Server Guard Deployment (Unified)
# https://render.com/docs/blueprint-spec

services:
  # ============================================
  # UNIFIED BACKEND - All services in one
  # ============================================
  - type: web
    name: server-guard-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:socket_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health

  # ============================================
  # FRONTEND - React Static Site
  # ============================================
  - type: web
    name: server-guard-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: server-guard-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
